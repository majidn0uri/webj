# =====================================================================
# ست‌شاپ — تنظیماتِ nginx (تولید)
# ---------------------------------------------------------------------
# نصب:  cp deploy/nginx/setshop.conf /etc/nginx/sites-available/setshop
#       ln -s /etc/nginx/sites-available/setshop /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# سه نکته‌یِ مهم در این تنظیمات:
#   ۱) API مستقیماً در دسترس نیست؛ فقط زیرِ /api/ پروکسی می‌شود.
#   ۲) هیچ دارایی از دامنه‌ی خارجی بارگذاری نمی‌شود (الزامِ بخش AA) —
#      فونت و تصویر همگی از همین دامنه‌اند، پس هیچ CDN ی در کار نیست.
#   ۳) فشرده‌سازی و کشِ دارایی‌هایِ ایستا روشن است، چون یکی از ضعف‌هایِ
#      اعلام‌شده‌یِ رقیب، دارایی‌هایِ فشرده‌نشده و کندیِ LCP است.
# =====================================================================

upstream setshop_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────────────────────
# چند فرآیندِ وب، نه یکی: Node تک‌رشته‌ای است، پس یک فرآیند بیش از یک هسته
# را به کار نمی‌گیرد. نصب (install.sh) به اندازه‌یِ هسته‌هایِ دستگاه — و حداکثر
# چهار — فرآیند بالا می‌آورد و فهرستِ زیر را همان‌جا می‌نویسد.
# هر فرآیند کشِ برگه‌یِ خود را دارد؛ برایِ همین تکرارِ یک درخواست ممکن است به
# فرآیندِ دیگری برود و برگه یک‌بارِ دیگر ساخته شود. این بها در برابرِ
# «فروشگاهی که در شلوغی از پا می‌افتد» ناچیز است.
# >>> فرآیندهایِ وب (install.sh این میان را بازنویسی می‌کند)
upstream setshop_web {
    server 127.0.0.1:3100;
    server 127.0.0.1:3101;
    keepalive 32;
}
# <<< فرآیندهایِ وب

# --- فشرده‌سازی: متن‌ها را تا حدِ امکان کوچک کن ---
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml application/javascript application/json
    application/xml application/xml+rss image/svg+xml font/woff2;

# --- نرخ‌محدودیت: جلویِ انبوهِ درخواست‌هایِ ورود و جستجو را می‌گیرد ---
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name forushgah.example.com;

    # در تولید همه‌چیز به HTTPS منتقل می‌شود
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forushgah.example.com;

    # گواهی: certbot --nginx -d forushgah.example.com
    # اگر گیرنده‌ی گواهی در دسترس نباشد، گواهی را دستی نصب کنید و همین دو خط را اصلاح نمایید.
    ssl_certificate     /etc/letsencrypt/live/forushgah.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forushgah.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;

    # حداکثرِ اندازه‌ی بارگذاری برای تصویرِ کالا
    client_max_body_size 20m;

    # --- سرآیندهایِ امنیتی ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # خط‌مشیِ امنیتِ محتوا: هیچ منبعی جز همین دامنه مجاز نیست (الزامِ AA)
    add_header Content-Security-Policy
      "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- لاگ ---
    access_log /var/log/nginx/setshop.access.log;
    error_log  /var/log/nginx/setshop.error.log;

    # --- دارایی‌هایِ ایستا: کشِ بلندمدت (نامِ فایل‌ها دارایِ اثرانگشت است) ---
    location /_next/static/ {
        proxy_pass http://setshop_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- فونتِ فارسی و تصاویرِ کالا: کشِ میان‌مدت ---
    location ~* \.(woff2|woff|jpg|jpeg|png|webp|avif|svg)$ {
        proxy_pass http://setshop_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- API ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # مسیرِ /api/ در هنگامِ پروکسی برداشته می‌شود تا API همان مسیرهایِ
        # اصلی خود را ببیند (مثال: /api/health → /health)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://setshop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # --- ورود: محدودیتِ سخت‌گیرانه‌تر (جلویِ حدس‌زدنِ رمز) ---
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://setshop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- وب‌سایت و پنل ---
    location / {
        proxy_pass http://setshop_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # پوشه‌یِ پشتیبان هرگز از وب در دسترس نیست
    location ^~ /backups/ { deny all; }
}
